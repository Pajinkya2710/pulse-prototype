<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PULSE</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%234f46e5'/%3E%3C/svg%3E" />
    <script>
      // Set the theme before first paint: saved choice, else the system setting.
      try {
        document.documentElement.dataset.theme = localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      } catch {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
    <style>
      :root {
        --fg: #111827; --muted: #6b7280; --line: #e5e7eb; --bg: #f4f5f9; --card: #fff; --soft: #f8f9fb;
        --accent: #4f46e5; --accent-soft: #eef2ff; --on-accent: #fff; --warn: #c2410c; --ok: #15803d;
        --header-bg: rgba(255, 255, 255, .88); --past-bg: #fffbeb; --past-line: #fcd34d; --live-bg: #f0fdf4; --live-line: #bbf7d0; --hover-line: #cbd5e1;
        --radius: 14px; --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 6px 20px rgba(16, 24, 40, .06);
        color-scheme: light;
      }
      :root[data-theme=dark] {
        --fg: #e5e7eb; --muted: #9ca3af; --line: #263041; --bg: #0b0f17; --card: #121826; --soft: #172033;
        --accent: #818cf8; --accent-soft: rgba(129, 140, 248, .14); --on-accent: #0b0f17; --warn: #fb923c; --ok: #4ade80;
        --header-bg: rgba(18, 24, 38, .85); --past-bg: rgba(251, 191, 36, .08); --past-line: rgba(251, 191, 36, .4); --live-bg: rgba(74, 222, 128, .1); --live-line: rgba(74, 222, 128, .3); --hover-line: #3b4658;
        --shadow: 0 1px 2px rgba(0, 0, 0, .3);
        color-scheme: dark;
      }
      /* Each role has a colour, so you can always see which one you are acting as. */
      [data-role=participant] { --role: #4f46e5; }
      [data-role=moderator] { --role: #d97706; }
      [data-role=admin] { --role: #dc2626; }

      * { box-sizing: border-box; }
      body { margin: 0; font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--fg); background: var(--bg); -webkit-font-smoothing: antialiased; }
      a { color: var(--accent); }
      h2, h3 { margin: 0 0 12px; letter-spacing: -.01em; }
      :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

      header { position: sticky; top: 0; z-index: 10; display: flex; gap: 20px; align-items: center; flex-wrap: wrap; padding: 10px 24px; background: var(--header-bg); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); box-shadow: inset 0 3px 0 var(--role); }
      .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: .12em; color: var(--fg); text-decoration: none; }
      .brand-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); animation: beat 2s infinite; }
      @keyframes beat { 50% { box-shadow: 0 0 0 8px transparent; } }
      header nav { display: flex; gap: 4px; flex: 1; }
      header nav a { padding: 6px 12px; border-radius: 8px; color: var(--muted); text-decoration: none; font-weight: 500; }
      header nav a:hover { background: var(--soft); color: var(--fg); }
      header nav a.active { background: var(--accent-soft); color: var(--accent); }

      .roles { display: flex; align-items: center; gap: 2px; padding: 3px; background: var(--soft); border: 1px solid var(--line); border-radius: 11px; }
      .dev-badge { font-size: 10px; font-weight: 700; letter-spacing: .1em; color: var(--muted); padding: 0 8px; cursor: help; }
      .roles .role-btn { border: 0; background: transparent; padding: 5px 12px; border-radius: 8px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
      .roles .role-btn::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--role); opacity: .35; }
      .roles .role-btn:hover { color: var(--fg); background: transparent; }
      .roles .role-btn.on { background: var(--card); color: var(--role); font-weight: 600; box-shadow: 0 1px 3px rgba(16, 24, 40, .12); }
      .roles .role-btn.on::before { opacity: 1; }
      .who { display: inline-flex; align-items: center; justify-content: center; gap: 4px; height: 34px; padding: 0 10px; width: 180px; font-size: 13px; color: var(--muted); background: var(--soft); border: 1px solid var(--line); border-radius: 9px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .who b { color: var(--role); font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
      input.who { justify-content: start; color: var(--fg); background: var(--card); }

      main { max-width: 1120px; margin: 0 auto; padding: 24px; }
      .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; box-shadow: var(--shadow); }
      .past { background: var(--past-bg); border-color: var(--past-line); }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
      .stat { padding: 14px 16px; border-radius: 12px; background: var(--soft); border: 1px solid var(--line); }
      .stat b { display: block; font-size: 30px; font-weight: 750; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
      .muted { color: var(--muted); font-size: 13px; }
      .warn { color: var(--warn); }
      .ok { color: var(--ok); }
      .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      .chip { display: inline-block; padding: 2px 10px; border: 1px solid var(--line); border-radius: 999px; font-size: 12.5px; background: var(--soft); white-space: nowrap; }
      button.chip.step { cursor: pointer; font-weight: 500; }
      button.chip.step.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
      .step-detail { margin: 0 0 12px; padding: 10px 14px; border: 1px solid var(--accent); border-radius: 10px; background: var(--accent-soft); font-size: 14px; }
      .displayed { margin-bottom: 0; }
      .chip.live { color: var(--ok); border-color: var(--live-line); background: var(--live-bg); }

      input, textarea, select, button { font: inherit; color: inherit; }
      input[type=text], input[type=url], textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 9px; background: var(--card); }
      input[type=range], input[type=radio] { accent-color: var(--accent); }
      button { padding: 6px 14px; border: 1px solid var(--line); border-radius: 9px; background: var(--card); cursor: pointer; font-weight: 500; transition: background .15s, border-color .15s; }
      button:hover:not(:disabled) { background: var(--soft); border-color: var(--hover-line); }
      button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
      button.primary:hover:not(:disabled) { filter: brightness(1.08); background: var(--accent); }
      button:disabled { opacity: .5; cursor: default; }
      details summary { cursor: pointer; color: var(--accent); font-weight: 500; margin: 8px 0; }

      table { border-collapse: collapse; width: 100%; }
      .scroll-x { overflow-x: auto; }
      th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; }
      td, th { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; font-size: 14px; }

      .qitem { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 16px; margin-bottom: 8px; border: 1px solid var(--line); border-radius: 12px; color: inherit; text-decoration: none; transition: border-color .15s, transform .15s; }
      .qitem:hover { border-color: var(--accent); transform: translateY(-1px); }

      /* Room: a dark big-screen theme, done by overriding the same tokens. */
      .room-screen { min-height: 100vh; padding: 20px 24px 40px; color: #f8fafc; background: radial-gradient(1200px 600px at 50% -10%, #312e81 0%, #0b1020 62%);
        --fg: #f8fafc; --muted: #9aa4b8; --line: rgba(255, 255, 255, .12); --card: rgba(255, 255, 255, .05); --soft: rgba(255, 255, 255, .04); --accent: #a5b4fc; --ok: #4ade80; --warn: #fb923c; }
      .room-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; max-width: 1100px; margin: 0 auto; }
      .room-bar a, .room-bar button { color: #c7d2fe; text-decoration: none; padding: 6px 12px; border: 1px solid var(--line); border-radius: 9px; background: transparent; font-size: 14px; }
      .room-bar a:hover, .room-bar button:hover:not(:disabled) { background: var(--soft); border-color: rgba(255, 255, 255, .25); }
      .room { text-align: center; max-width: 1100px; margin: 0 auto; padding-top: 32px; }
      .room h1 { font-size: clamp(24px, 3.4vw, 42px); letter-spacing: -.02em; margin: 0 0 8px; }
      .room .big { font-size: clamp(80px, 15vw, 180px); font-weight: 800; line-height: 1; letter-spacing: -.04em; font-variant-numeric: tabular-nums; background: linear-gradient(180deg, #fff, #a5b4fc); -webkit-background-clip: text; background-clip: text; color: transparent; }
      .room .big.empty { font-size: clamp(36px, 6vw, 64px); padding: 40px 0 8px; }
      .room .card { box-shadow: none; text-align: left; margin: 32px auto; }

      @media (max-width: 640px) {
        header, main { padding-left: 16px; padding-right: 16px; }
        .roles { flex-wrap: wrap; max-width: 100%; }
        .roles .role-btn { padding: 5px 8px; }
      }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
